server:
  port: 8080

spring:
  application:
    name: dota-party-analyzer
  thymeleaf:
    cache: false

opendota:
  api:
    base-url: https://api.opendota.com/api
    connect-timeout-seconds: 10
    read-timeout-seconds: 30
    max-retries: 1
    api-key: ${OPENDOTA_API_KEY:}

logging:
  level:
    com.dimas.dotaanalyzer: INFO
